<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Blame the Stock mark: a rounded black square split 40/60, blue = the pair, vermilion = the coin. -->
  <defs>
    <clipPath id="bts-mark">
      <rect width="64" height="64" rx="15" ry="15"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bts-mark)">
    <rect x="0" y="0" width="64" height="64" fill="#000000"/>
    <rect x="0" y="0" width="23.35" height="64" fill="#2433FF"/>
    <rect x="27.85" y="0" width="36.15" height="64" fill="#FF4F1F"/>
  </g>
</svg>
