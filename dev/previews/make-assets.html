<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make assets · Blame the Stock (dev)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #111; color: #fff; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  p { color: #8b8b8b; margin: 0 0 16px; max-width: 70ch; }
  button { font: inherit; color: #000; background: #fff; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; margin-top: 20px; }
  figure { margin: 0; }
  figcaption { color: #8b8b8b; font-size: 12px; margin-top: 6px; }
  canvas { display: block; background: repeating-conic-gradient(#222 0 25%, #1a1a1a 0 50%) 0 0 / 16px 16px; }
  #og { width: 600px; height: auto; max-width: 100%; }
  #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; color: #8b8b8b; margin-top: 16px; }
</style>
</head>
<body>
  <h1>Link preview picture and icons</h1>
  <p>Draws site/assets/og.png (1200×630), icon-32.png and icon-180.png in the site font, then saves them through the
     local dev server. icon.svg is written by hand. Add ?save=1 to save on load.</p>
  <button type="button" id="save">Save to site/assets</button>
  <div class="grid">
    <figure><canvas id="og" width="1200" height="630"></canvas><figcaption>og.png 1200×630 (shown at half size)</figcaption></figure>
    <figure><canvas id="i180" width="180" height="180"></canvas><figcaption>icon-180.png</figcaption></figure>
    <figure><canvas id="i32" width="32" height="32"></canvas><figcaption>icon-32.png</figcaption></figure>
    <figure><img src="../../site/assets/icon.svg" width="64" height="64" alt=""><figcaption>icon.svg (hand-written)</figcaption></figure>
  </div>
  <div id="log"></div>

<script type="module">
import { SETTINGS } from '../../site/settings.js';
import { fontInfo, waitForFonts, useFont, drawMark, drawWordmark } from '../../site/src/ui/share.js';

const FONT_CSS = {
  archivo: 'https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap',
  robotoflex: 'https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap',
};
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const C = { bg: '#000000', fg: '#FFFFFF', grey: '#8B8B8B', line: '#262626', pair: '#2433FF', coin: '#FF4F1F' };

const link = document.createElement('link');
link.rel = 'stylesheet';
link.href = FONT_CSS[SETTINGS.font] || FONT_CSS.archivo;
document.head.append(link);
await new Promise((r) => { link.onload = r; link.onerror = r; setTimeout(r, 4000); });
await waitForFonts(SETTINGS, 5000);
const F = fontInfo(SETTINGS);
log(`font: ${F.family} (${F.narrow}) loaded: ${document.fonts.check(`${F.narrow} 900 100px ${F.stack}`)}`);

function wrap(ctx, text, maxW) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const next = line ? line + ' ' + w : w;
    if (line && ctx.measureText(next).width > maxW) { lines.push(line); line = w; } else line = next;
  }
  if (line) lines.push(line);
  return lines;
}

// Letter-squeezed text (negative tracking), drawn one glyph at a time.
function squeezed(ctx, text, x, y, track) {
  let cx = x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + track; }
  return cx - x - track;
}
function squeezedWidth(ctx, text, track) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + track;
  return w - track;
}

function drawOg(cv) {
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, PAD = 64;
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';

  // Top row: wordmark left, address right
  drawWordmark(ctx, SETTINGS, PAD, PAD - 8, 28);
  useFont(ctx, SETTINGS, { size: 22, weight: 600 });
  ctx.fillStyle = C.grey;
  ctx.textAlign = 'right';
  ctx.fillText(SETTINGS.site.url.replace(/^https?:\/\//, ''), W - PAD, PAD - 8 + 28);
  ctx.textAlign = 'left';

  // Bottom: split bar motif (40 / 60)
  const barH = 22, barY = H - PAD - barH, inner = W - PAD * 2, gap = 5;
  const pw = (inner - gap) * 0.4;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(PAD, barY, inner, barH, barH / 2) : ctx.rect(PAD, barY, inner, barH);
  ctx.clip();
  ctx.fillStyle = C.pair; ctx.fillRect(PAD, barY, pw, barH);
  ctx.fillStyle = C.coin; ctx.fillRect(PAD + pw + gap, barY, inner - pw - gap, barH);
  ctx.restore();

  // Line above the bar
  useFont(ctx, SETTINGS, { size: 30, weight: 500 });
  ctx.fillStyle = C.grey;
  const lines = wrap(ctx, SETTINGS.site.description, 760);
  const lh = 38;
  const descLast = barY - 36;
  lines.forEach((l, i) => ctx.fillText(l, PAD, descLast - (lines.length - 1 - i) * lh));
  const descTop = descLast - (lines.length - 1) * lh - 30;

  // Headline: two lines, heavy and narrow, the wider line sized to fill the space
  const l1 = SETTINGS.headline.line1.toUpperCase(), l2 = SETTINGS.headline.line2.toUpperCase();
  const top = PAD + 64, bottom = descTop - 34;
  const TRACK = -0.012, LH = 0.86, CAP = 0.72;
  useFont(ctx, SETTINGS, { size: 100, weight: 900, narrow: true });
  const w100 = Math.max(squeezedWidth(ctx, l1, TRACK * 100), squeezedWidth(ctx, l2, TRACK * 100));
  let size = Math.floor(100 * inner / w100);
  size = Math.min(size, Math.floor((bottom - top) / (CAP + LH)));
  useFont(ctx, SETTINGS, { size, weight: 900, narrow: true });
  ctx.fillStyle = C.fg;
  const y1 = top + size * CAP;
  const hw = Math.max(squeezed(ctx, l1, PAD - size * 0.02, y1, TRACK * size),
    squeezed(ctx, l2, PAD - size * 0.02, y1 + size * LH, TRACK * size));
  log(`og headline size ${size}px, width ${Math.round(hw)}px`);
  return { right: PAD + hw, top, bottom: y1 + size * LH };
}

// ---- Stickers for the empty right side of og.png (from site/src/ui/stickers.js) ----------------------
// SVG pictures can't reach the page's fonts, so the site font file is embedded into each sticker.
async function embeddedFontCss() {
  try {
    const css = await (await fetch(FONT_CSS[SETTINGS.font] || FONT_CSS.archivo)).text();
    const blocks = css.split('@font-face').slice(1);
    const latin = blocks.find((b) => /U\+0000-00FF/.test(b)) || blocks[blocks.length - 1];
    const url = latin.match(/url\((https:[^)]+)\)/)[1];
    const buf = new Uint8Array(await (await fetch(url)).arrayBuffer());
    let bin = '';
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
    const range = SETTINGS.font === 'robotoflex' ? 'font-weight:100 1000;font-stretch:25% 151%' : 'font-weight:100 900;font-stretch:62% 125%';
    log(`embedded sticker font: ${Math.round(buf.length / 1024)} KB`);
    return `@font-face{font-family:'StickerFace';src:url(data:font/woff2;base64,${btoa(bin)}) format('woff2');${range}}`;
  } catch (e) {
    log('sticker font not embedded (' + e.message + '), using system condensed fonts');
    return '';
  }
}

function loadImage(src) {
  return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
}

async function drawOgStickers(cv, box) {
  let mod;
  try { mod = await import('../../site/src/ui/stickers.js'); } catch (e) { log('no stickers.js'); return; }
  const fontCss = await embeddedFontCss();
  const face = fontCss ? `'StickerFace','Arial Narrow',sans-serif` : `'Arial Narrow','Avenir Next Condensed',sans-serif`;
  const ctx = cv.getContext('2d');
  const picks = [
    { kind: 'tag', text: 'IT WAS THE STOCK', palette: 'vermilion', seed: 7, cx: 0.50, cy: 0.20, rot: -7, scale: 1.25 },
    { kind: 'ticket', text: 'NVDA', palette: 'blue', seed: 3, cx: 0.66, cy: 0.56, rot: 6, scale: 1.2 },
    { kind: 'stamp', text: "WASN'T ME", palette: 'white', seed: 5, cx: 0.30, cy: 0.83, rot: -4, scale: 1.1 },
  ];
  for (const p of picks) {
    const s = mod.makeSticker({ kind: p.kind, text: p.text, palette: p.palette, seed: p.seed, settings: SETTINGS });
    let svg = s.svg.replace(/var\(--font[^)]*\)/g, face);
    if (fontCss) svg = svg.replace(/(<svg[^>]*>)/, `$1<style>${fontCss}</style>`);
    const img = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
    const w = s.width * p.scale, h = s.height * p.scale;
    const x = box.x + box.w * p.cx, y = box.y + box.h * p.cy;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  }
}

function drawIcon180(cv) {
  const ctx = cv.getContext('2d');
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, 180, 180);
  drawMark(ctx, 34, 34, 112, { radius: 26, gap: 8 });
}

function drawIcon32(cv) {
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 32, 32);
  drawMark(ctx, 0, 0, 32, { radius: 7.5, gap: 2.25 });
}

const og = document.getElementById('og');
const i180 = document.getElementById('i180');
const i32 = document.getElementById('i32');
const head = drawOg(og);
// Sticker area: right of the headline, between the top row and the description line.
await drawOgStickers(og, { x: head.right + 24, y: head.top - 20, w: 1200 - 64 - head.right - 24, h: head.bottom - head.top + 30 });
drawIcon180(i180);
drawIcon32(i32);

async function save(cv, name) {
  const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
  const res = await fetch(`/__save?path=site/assets/${name}`, { method: 'POST', body: blob });
  log(`${res.status} ${await res.text()}`);
}
async function saveAll() {
  await save(og, 'og.png');
  await save(i180, 'icon-180.png');
  await save(i32, 'icon-32.png');
  log('done');
  document.body.dataset.saved = '1';
}
document.getElementById('save').addEventListener('click', saveAll);
if (new URLSearchParams(location.search).get('save') === '1') saveAll();
</script>
</body>
</html>
