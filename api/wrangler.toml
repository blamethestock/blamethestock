# Blame the Stock API Worker (bts-api). PREPARED ONLY: nothing here has been deployed.
#
# Local (no Cloudflare account needed):
#   sh dev/tools/local_e2e.sh                      creates the local D1, loads the index, starts wrangler dev on :8787
#   cd api && npm run dev                          wrangler dev --local on :8787 (uses the same local D1)
#   cd api && npm run test-scheduled               same, plus http://localhost:8787/__scheduled runs the cron once
#
# Deploy steps (later, after the owner has run `npx wrangler login`):
#   1. npx wrangler d1 create bts                  -> paste the printed database_id below (replace REPLACE_AT_DEPLOY)
#   2. npx wrangler d1 execute bts --remote --file=schema.sql
#      npx wrangler d1 execute bts --remote --file=schema-reports.sql
#   3. uncomment `routes` below (needs blamethestock.com as an active zone in the same account)
#   4. npx wrangler deploy                         (run inside api/)
#
# Built for the Workers FREE plan (10 ms CPU, 50 subrequests and 50 D1 queries per request; Cache API calls share the
# subrequest quota): see src/budget.js.

name = "bts-api"
main = "src/entry.js"           # loads the MCP SDK and the report modules at startup, then runs src/worker.js
compatibility_date = "2026-11-01"
# nodejs_compat: the MCP handler (agents/mcp) uses AsyncLocalStorage; the Worker uses it to count each
# request's subrequests on that request's own budget.
compatibility_flags = ["nodejs_compat"]
workers_dev = false               # only reachable on the custom domain once deployed

# Custom domain, turned on at deploy time (step 3 above):
routes = [
  { pattern = "api.blamethestock.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "bts"
database_id = "6973e4d6-b6d6-4717-a88e-a0c44beca8f1"

# Every minute: the launch indexer (new TokenLaunched events, name()/symbol()), then queued report/link jobs.
[triggers]
crons = ["* * * * *"]

[vars]
# The official $BLAME address, set on launch day (must match site/settings.js token.contractAddress and
# trust.official). Empty = no official coin yet.
OFFICIAL = ""
# Browser origins allowed by CORS (comma-separated). Anything else still gets JSON, without the CORS header.
SITE_ORIGINS = "https://blamethestock.com,https://www.blamethestock.com,http://localhost:8765"

# Logs: the Worker's own lines only (indexer progress, errors). invocation_logs = false turns off the automatic
# per-request log line, which carries request metadata. No line the Worker writes ever holds an IP address or a
# user agent.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false

# Traces would record every request and subrequest with its metadata: kept off.
[observability.traces]
enabled = false
